[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tech-wave-tiktok-data-automation"
version = "0.1.0"
description = "Safe, auditable local TikTok Shop report ingestion and analytics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "python-dotenv>=1,<2",
  "tenacity>=8.2,<10",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires explicitly configured external credentials and network access",
]

